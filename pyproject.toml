# Minimal packaging: `pip install -e .` makes `volumetric_reasoning` importable.
# The scripts in scripts/ also work without installing (they add src/ to the path).
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "volumetric-reasoning"
version = "0.0.1"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
