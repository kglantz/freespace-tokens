# Default configuration. Copy to configs/local.yaml (git-ignored) to override
# machine-specific values such as the dataset location.

dataset:
  name: scannetpp
  # Relative paths resolve against the repository root.
  # Either place/symlink the dataset here or override in configs/local.yaml.
  root: data/scannetpp
  scene_id: 1ada7a0617    # office, ~17 m², window blinds closed; in VSI-Bench and ReVSI
                          # (3e8bba0176: reflective windows, kept as a failure case)
  modality: iphone        # only iPhone (LiDAR) and panocam provide depth; DSLR has none

frames:
  start: 0
  stride: 60              # iPhone video is 60 fps -> one frame per second (~120 frames)
  max_frames: null        # null = up to the end of the sequence

depth:
  min_depth: 0.1          # meters
  max_depth: 4.0          # meters; beyond ~4 m ARKit depth is mostly wrong (windows/glass),
                          # see experiments/02_backprojection.ipynb

tsdf:
  frame_stride: 20        # every 20th frame (~3 fps); fewer frames leave regions below weight_threshold
  voxel_size: 0.02        # meters; 1 cm gave no better F-score than 2 cm on 1ada7a0617, 5x more voxels
  trunc_voxels: 4         # truncation distance = trunc_voxels * voxel_size
  weight_threshold: 3     # mesh extraction skips voxels observed fewer times

output:
  root: outputs           # git-ignored
